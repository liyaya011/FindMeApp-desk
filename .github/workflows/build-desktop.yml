name: Build Desktop Apps

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ====================== macOS Build ======================
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      # actions/setup-python builds do NOT include tkinter; use Homebrew Python
      # + python-tk so the venv (and thus PyInstaller/build.spec) can import tkinter.
      - name: Install Python 3.11 with tkinter (Homebrew)
        run: brew install python@3.11 python-tk@3.11

      - name: Install dependencies
        run: |
          /opt/homebrew/opt/python@3.11/bin/python3.11 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.0

      - name: Download insightface model
        run: |
          source .venv/bin/activate
          mkdir -p assets/models
          python -c "from insightface.utils import ensure_available; ensure_available('models', 'buffalo_l', root='assets')"

      - name: Build .app
        run: |
          source .venv/bin/activate
          export PYINSTALLER_CONFIG_DIR=$PWD/.pyinstaller_cache
          pyinstaller build.spec --noconfirm

      - name: Create ZIP artifact
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/FindMeApp.app dist/FindMeApp-macOS-arm64.zip

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindMeApp-macOS-arm64
          path: dist/FindMeApp-macOS-arm64.zip
          retention-days: 30

      - name: Attach to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FindMeApp-macOS-arm64.zip
          draft: true
          body: |
            # FindMeApp 桌面版

            📷 上传 1–3 张自拍 + 一批照片/视频，自动找出有你的照片、生成高光短视频、绘制 GPS 旅行回忆地图。

            ## 下载

            | 平台 | 文件 | 安装方式 |
            |---|---|---|
            | macOS（Apple Silicon） | `FindMeApp-macOS-arm64.zip` | 解压后拖入「应用程序」 |
            | Windows 10/11 x64 | `FindMeApp-Windows-x64.zip` | 解压后运行 `FindMeApp.exe` |

            内置人脸识别模型与 ffmpeg，无需额外安装任何组件。

            ## macOS 首次打开

            应用暂未签名，首次打开若提示「无法验证」或「已损坏」：

            1. 右键 FindMeApp →「打开」→ 再点「打开」；
            2. 若仍提示「已损坏」，在「终端」执行：
               ```
               xattr -cr /Applications/FindMeApp.app
               ```

            ## Windows 说明

            - 如杀毒软件误报，请选择「允许运行」（PyInstaller 打包的应用常见误报）；
            - 数据保存在 `C:\Users\<你>\AppData\Local\FindMeApp`。

            ## 系统要求

            - macOS 11+（Apple Silicon / M 系列）
            - Windows 10/11（64 位）

  # ====================== Windows Build ======================
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\pip install -r requirements.txt
          .venv\Scripts\pip install pyinstaller==6.22.0

      - name: Download insightface model
        run: |
          mkdir -p assets\models
          .venv\Scripts\python.exe -c "from insightface.utils import ensure_available; ensure_available('models', 'buffalo_l', root='assets')"
        shell: pwsh

      - name: Build .exe
        run: |
          .venv\Scripts\python.exe -m PyInstaller build.spec --noconfirm
        shell: pwsh

      - name: Create ZIP artifact
        run: |
          Compress-Archive -Path dist\FindMeApp -DestinationPath dist\FindMeApp-Windows-x64.zip
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: FindMeApp-Windows-x64
          path: dist/FindMeApp-Windows-x64.zip
          retention-days: 30

      - name: Attach to release (if tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FindMeApp-Windows-x64.zip
          draft: true
